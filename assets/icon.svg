<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="50%" style="stop-color:#ff9f43"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="100%" style="stop-color:#302b63"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Flame body -->
  <path d="M256 80
           C200 160 140 220 140 300
           C140 370 190 420 256 420
           C322 420 372 370 372 300
           C372 220 312 160 256 80 Z"
        fill="url(#flame)" opacity="0.9"/>

  <!-- Inner flame -->
  <path d="M256 140
           C220 200 180 250 180 300
           C180 350 210 390 256 390
           C302 390 332 350 332 300
           C332 250 292 200 256 140 Z"
        fill="#ffd700" opacity="0.6"/>

  <!-- Core -->
  <path d="M256 200
           C230 240 210 270 210 310
           C210 340 230 370 256 370
           C282 370 302 340 302 310
           C302 270 282 240 256 200 Z"
        fill="#fff" opacity="0.8"/>

  <!-- Sparkles -->
  <circle cx="120" cy="180" r="4" fill="#ffd700" opacity="0.8"/>
  <circle cx="100" cy="250" r="3" fill="#ff9f43" opacity="0.6"/>
  <circle cx="140" cy="130" r="5" fill="#ff6b35" opacity="0.7"/>
  <circle cx="390" cy="200" r="4" fill="#ffd700" opacity="0.8"/>
  <circle cx="410" cy="280" r="3" fill="#ff9f43" opacity="0.6"/>
  <circle cx="370" cy="140" r="5" fill="#ff6b35" opacity="0.7"/>
</svg>
