[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unrotting"
version = "1.0.0"
description = "Block short-form content. Earn your scroll."
authors = [{name = "Unrotting"}]
requires-python = ">=3.10"
dependencies = [
    "pywebview>=4.0",
    "pywin32>=300",
    "pystray>=0.19",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["unrotting*"]

[project.scripts]
unrotting = "unrotting.app.main:cli"
